name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gateway
            package: "@arena/gateway"
            dockerfile: infra/docker/node-service.Dockerfile
          - name: realtime
            package: "@arena/realtime"
            dockerfile: infra/docker/node-service.Dockerfile
          - name: matchmaker
            package: "@arena/matchmaker"
            dockerfile: infra/docker/node-service.Dockerfile
          - name: web
            package: "@arena/web"
            dockerfile: infra/docker/web.Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PACKAGE=${{ matrix.package }}
            APP_DIR=${{ matrix.name }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_GATEWAY_URL=${{ vars.NEXT_PUBLIC_GATEWAY_URL }}
            NEXT_PUBLIC_MATCHMAKER_URL=${{ vars.NEXT_PUBLIC_MATCHMAKER_URL }}
            NEXT_PUBLIC_SOLANA_CLUSTER=${{ vars.NEXT_PUBLIC_SOLANA_CLUSTER }}
            NEXT_PUBLIC_SOLANA_RPC_URL=${{ vars.NEXT_PUBLIC_SOLANA_RPC_URL }}
            NEXT_PUBLIC_ARENA_PROGRAM_ID=${{ vars.NEXT_PUBLIC_ARENA_PROGRAM_ID }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

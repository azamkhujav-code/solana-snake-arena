global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: slither-arena

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:4000"]

  - job_name: matchmaker
    metrics_path: /metrics
    static_configs:
      - targets: ["matchmaker:4002"]

  - job_name: realtime
    metrics_path: /metrics
    # Realtime nodes come and go with autoscaling; in Kubernetes this becomes a
    # kubernetes_sd_config on the realtime StatefulSet rather than static hosts.
    static_configs:
      - targets: ["realtime:4001"]

worker_processes auto;
# One WebSocket connection is one file descriptor; the default 1024 caps a node
# far below its real capacity.
worker_rlimit_nofile 200000;

events {
    worker_connections 65535;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;

    # Game traffic is latency-sensitive; long keepalives avoid handshake churn.
    keepalive_timeout  120s;
    keepalive_requests 10000;

    log_format json escape=json
      '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
      '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
      '"rt":$request_time,"upstream":"$upstream_addr","ua":"$http_user_agent"}';
    access_log /var/log/nginx/access.log json;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1024;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    limit_req_zone $binary_remote_addr zone=api:20m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn:20m;

    upstream web        { least_conn; server web:3000        max_fails=3 fail_timeout=10s; keepalive 64; }
    upstream gateway    { least_conn; server gateway:4000    max_fails=3 fail_timeout=10s; keepalive 64; }
    upstream matchmaker { least_conn; server matchmaker:4002 max_fails=3 fail_timeout=10s; keepalive 64; }

    server {
        listen 80;
        server_name _;

        # Health endpoint for the external load balancer.
        location = /healthz {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        location /api/ {
            limit_req  zone=api burst=60 nodelay;
            limit_conn conn 100;

            proxy_pass         http://gateway/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 30s;
        }

        location /matchmake/ {
            limit_req  zone=api burst=20 nodelay;
            proxy_pass http://matchmaker/;
            proxy_http_version 1.1;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection      "";
        }

        # Realtime is intentionally NOT proxied here.
        #
        # Rooms are pinned to a specific node, and the matchmaker hands the
        # client that node's address directly. Fronting it with a round-robin
        # proxy would route a player to a machine that does not host their room.
        # Each realtime pod is exposed individually (see infra/k8s).

        location / {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
        }
    }
}

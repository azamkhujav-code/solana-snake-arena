# Production-leaning overrides.
#
# Layer on top of the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Intended for a single-host staging deployment. Real production runs on
# Kubernetes (see infra/k8s) because the realtime tier needs per-pod addressing
# and a drain-aware rollout, neither of which Compose provides.

name: slither-arena-prod

services:
  gateway:
    profiles: []
    restart: always
    environment:
      NODE_ENV: production
      LOG_PRETTY: "false"
    deploy:
      replicas: 3
      resources:
        limits: { cpus: "1.0", memory: 512M }
        reservations: { cpus: "0.25", memory: 256M }

  matchmaker:
    profiles: []
    restart: always
    environment:
      NODE_ENV: production
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "0.5", memory: 256M }

  realtime:
    profiles: []
    restart: always
    environment:
      NODE_ENV: production
      TICK_RATE_HZ: "30"
      SNAPSHOT_RATE_HZ: "15"
    deploy:
      # Realtime is CPU-bound on the tick loop; one vCPU per process and scale
      # by adding processes rather than by giving one process more cores. Node
      # cannot use the extra cores for a single event loop.
      resources:
        limits: { cpus: "1.0", memory: 2G }
        reservations: { cpus: "1.0", memory: 1G }
    stop_grace_period: 60s

  web:
    profiles: []
    restart: always
    environment:
      NODE_ENV: production
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "0.5", memory: 512M }

  nginx:
    image: nginx:1.27-alpine
    restart: always
    depends_on: [web, gateway, matchmaker, realtime]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
